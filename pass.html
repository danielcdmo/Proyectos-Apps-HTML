<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KeyPass Pro</title>
  <style>
    :root {
      --bg: #0b1329;
      --card: #1c2541;
      --accent: #38bdf8;
      --text: #f8fafc;
      --green: #10b981;
      --input-bg: #0b1120;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      padding: 26px 20px;
      border-radius: 24px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    h1 {
      font-size: 1.15rem;
      color: var(--accent);
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }
    .output-box {
      background: var(--input-bg);
      padding: 14px;
      border-radius: 14px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 1.1rem;
      word-break: break-all;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    input[type="range"] {
      width: 100%;
      margin: 8px 0 16px 0;
      accent-color: var(--accent);
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      color: white;
    }
    button:active {
      transform: scale(0.96);
    }
    .btn-gen { background: var(--accent); color: #0b1329; }
    .btn-copy { background: var(--green); }
    .toast {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 KeyPass Pro</h1>

    <div class="output-box" id="password">--------</div>

    <div class="option">
      <span>Longitud: <strong id="lenVal" style="color: #fff;">16</strong></span>
    </div>
    <input type="range" id="length" min="6" max="32" value="16" oninput="updateLen()">

    <div class="option">
      <span>Mayúsculas (A-Z)</span>
      <input type="checkbox" id="upper" checked>
    </div>

    <div class="option">
      <span>Números (0-9)</span>
      <input type="checkbox" id="nums" checked>
    </div>

    <div class="option">
      <span>Símbolos (!@#$)</span>
      <input type="checkbox" id="syms" checked>
    </div>

    <div class="btn-group">
      <button class="btn-gen" onclick="generate()">Generar</button>
      <button class="btn-copy" onclick="copyPass()">Copiar</button>
    </div>

    <div class="toast" id="toast">Test Sync Post-Reinicio</div>
  </div>

  <script>
    function updateLen() {
      document.getElementById('lenVal').textContent = document.getElementById('length').value;
      generate();
    }

    function generate() {
      if (window.navigator.vibrate) window.navigator.vibrate(10);
      const len = parseInt(document.getElementById('length').value);
      const useUpper = document.getElementById('upper').checked;
      const useNums = document.getElementById('nums').checked;
      const useSyms = document.getElementById('syms').checked;

      let chars = 'abcdefghijklmnopqrstuvwxyz';
      if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (useNums) chars += '0123456789';
      if (useSyms) chars += '!@#$%^&*()_+~`|}{[]:;?><,./-=';

      let pass = '';
      for (let i = 0; i < len; i++) {
        pass += chars.charAt(Math.floor(Math.random() * chars.length));
      }

      document.getElementById('password').textContent = pass;
    }

    function copyPass() {
      const pass = document.getElementById('password').textContent;
      if (!pass || pass === '--------') return;
      navigator.clipboard.writeText(pass);
      if (window.navigator.vibrate) window.navigator.vibrate(25);
      const toast = document.getElementById('toast');
      toast.textContent = '¡Copiada al portapapeles!';
      toast.style.color = '#10b981';
      setTimeout(() => {
        toast.textContent = 'Test Sync Post-Reinicio';
        toast.style.color = '#64748b';
      }, 2000);
    }

    generate();
  </script>
</body>
</html>
