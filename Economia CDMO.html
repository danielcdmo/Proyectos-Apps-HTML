<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Economía CDMO</title>
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-green: #10b981;
            --accent-orange: #f97316;
            --accent-blue: #3b82f6;
            --neutral-bg: rgba(51, 65, 85, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            background: var(--bg-grad);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 30px;
        }

        .header {
            text-align: center;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 4px 0;
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin: 0;
        }

        /* Navegador de Mes */
        .month-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 8px 16px;
            backdrop-filter: blur(12px);
        }
        .month-btn {
            background: var(--neutral-bg);
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
        }
        .month-title {
            font-weight: 700;
            font-size: 1.05rem;
            text-transform: capitalize;
        }

        /* Summary Dashboard */
        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            backdrop-filter: blur(12px);
        }
        .stat-box {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-box.full {
            grid-column: span 2;
            background: rgba(249, 115, 22, 0.12);
            border: 1px solid rgba(249, 115, 22, 0.3);
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .stat-val {
            font-size: 1.3rem;
            font-weight: 800;
        }
        .stat-val.pending { color: var(--accent-orange); font-size: 1.7rem; }
        .stat-val.paid { color: var(--accent-green); }

        /* Categorías y Listas */
        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px;
            backdrop-filter: blur(12px);
        }
        .category-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 8px;
        }
        .item-row:last-child {
            border-bottom: none;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border-radius: 7px;
            border: 2px solid var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 800;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }
        .checkbox.checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #000;
        }

        .item-label {
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.2;
        }
        .item-label.done {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .amount-container {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 3px 6px;
        }
        .amount-input {
            width: 62px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.9rem;
            text-align: right;
            outline: none;
        }
        .currency {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 700;
        }

        /* Botones de acción */
        .btn-add {
            background: rgba(59, 130, 246, 0.15);
            border: 1px dashed rgba(59, 130, 246, 0.4);
            color: var(--accent-blue);
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 6px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-action {
            flex: 1;
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-whatsapp {
            background: #25D366;
            color: #000;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);
        }
        .btn-reset {
            background: var(--neutral-bg);
            color: var(--text-sub);
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 Economía CDMO</h1>
        <p>Checklist & Control de Gastos Mensuales</p>
    </div>

    <!-- Navegador de Mes -->
    <div class="month-selector">
        <button class="month-btn" onclick="changeMonth(-1)">‹</button>
        <div class="month-title" id="monthTitle">-- ----</div>
        <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>

    <!-- Resumen del Mes -->
    <div class="summary-card">
        <div class="stat-box">
            <div class="stat-label">Total Mes (Claudia)</div>
            <div class="stat-val" id="totalMonth">0,00 €</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Pagado / OK</div>
            <div class="stat-val paid" id="totalPaid">0,00 €</div>
        </div>
        <div class="stat-box full">
            <div class="stat-label">Pendiente por Pagar (Claudia ➔ Daniel)</div>
            <div class="stat-val pending" id="totalPending">0,00 €</div>
        </div>
    </div>

    <!-- Contenedor dinámico de categorías -->
    <div id="categoriesContainer"></div>

    <!-- Botón Gasto Extra -->
    <button class="btn-add" onclick="addExtraItem()">+ Añadir Concepto Extra</button>

    <!-- Acciones -->
    <div class="actions">
        <button class="btn-action btn-whatsapp" onclick="sendWhatsApp()">
            💬 Enviar Resumen
        </button>
        <button class="btn-action btn-reset" onclick="resetMonth()">
            🔄 Reiniciar
        </button>
    </div>
</div>

<script>
    let currentDate = new Date();
    let db = JSON.parse(localStorage.getItem('economia_cdmo_db')) || {};

    // Plantilla de conceptos por defecto
    const DEFAULT_ITEMS = [
        // Vivienda y suministros
        { id: 'v_alquiler', cat: '🏠 Vivienda y Suministros', label: 'Alquiler Casa CDMO', amount: 390.00, isMoney: true },
        { id: 'v_fibra', cat: '🏠 Vivienda y Suministros', label: 'Telefonía + Fibra', amount: 35.00, isMoney: true },
        { id: 'v_alarma', cat: '🏠 Vivienda y Suministros', label: 'Alarma Securitas', amount: 30.00, isMoney: true },
        { id: 'v_aquablue', cat: '🏠 Vivienda y Suministros', label: 'Aquablue', amount: 15.00, isMoney: true },
        { id: 'v_luz', cat: '🏠 Vivienda y Suministros', label: 'Factura de Luz (Parte Claudia)', amount: 0.00, isMoney: true },
        { id: 'v_agua', cat: '🏠 Vivienda y Suministros', label: 'Factura de Agua (Parte Claudia)', amount: 0.00, isMoney: true },
        { id: 'v_impuestos', cat: '🏠 Vivienda y Suministros', label: 'Tasa Residuos / Impuestos', amount: 0.00, isMoney: true },

        // Gastos Olivia
        { id: 'o_judo', cat: '👧 Gastos Olivia', label: 'Judo Olivia (Parte Claudia)', amount: 10.00, isMoney: true },
        { id: 'o_colegio', cat: '👧 Gastos Olivia', label: 'Colegio NSDP / Comedor / Piscina', amount: 0.00, isMoney: true },

        // Suscripciones
        { id: 's_psplus', cat: '📺 Suscripciones y Servicios', label: 'PS Plus (Parte Claudia)', amount: 20.00, isMoney: true },

        // Seguros
        { id: 's_sanitas', cat: '🛡️ Seguros', label: 'Seguro Sanitas Daniel (Claudia)', amount: 50.00, isMoney: true },
        { id: 's_hogar', cat: '🛡️ Seguros', label: 'Seguro Hogar (110€ si procede)', amount: 0.00, isMoney: true },

        // Administración & Tareas
        { id: 'a_pdf', cat: '📁 Administración & Cierre', label: 'PDFs y extractos guardados', amount: 0.00, isMoney: false },
        { id: 'a_compras', cat: '📁 Administración & Cierre', label: 'Gastos y compras archivadas', amount: 0.00, isMoney: false },
        { id: 'a_comedor', cat: '📁 Administración & Cierre', label: 'Reset comedor realizado & Numbers', amount: 0.00, isMoney: false },
        { id: 'a_cierre', cat: '📁 Administración & Cierre', label: 'Mes cerrado y cuadrado 💰📊', amount: 0.00, isMoney: false }
    ];

    function getMonthKey() {
        const year = currentDate.getFullYear();
        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
        return `${year}-${month}`;
    }

    function initMonthData() {
        const key = getMonthKey();
        if (!db[key]) {
            db[key] = DEFAULT_ITEMS.map(item => ({ ...item, checked: false }));
            saveDB();
        }
    }

    function saveDB() {
        localStorage.setItem('economia_cdmo_db', JSON.stringify(db));
    }

    function render() {
        initMonthData();
        const key = getMonthKey();
        const items = db[key];

        const options = { month: 'long', year: 'numeric' };
        document.getElementById('monthTitle').textContent = currentDate.toLocaleDateString('es-ES', options);

        const categories = {};
        items.forEach((item, index) => {
            if (!categories[item.cat]) categories[item.cat] = [];
            categories[item.cat].push({ ...item, originalIndex: index });
        });

        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';

        let totalMonth = 0;
        let totalPaid = 0;
        let totalPending = 0;

        for (const [catName, catItems] of Object.entries(categories)) {
            const card = document.createElement('div');
            card.className = 'category-card';
            card.innerHTML = `<div class="category-title">${catName}</div>`;

            catItems.forEach(item => {
                const amt = parseFloat(item.amount) || 0;
                
                if (item.isMoney) {
                    totalMonth += amt;
                    if (item.checked) {
                        totalPaid += amt;
                    } else {
                        totalPending += amt;
                    }
                }

                const row = document.createElement('div');
                row.className = 'item-row';

                row.innerHTML = `
                    <div class="item-left" onclick="toggleCheck(${item.originalIndex})">
                        <div class="checkbox ${item.checked ? 'checked' : ''}">
                            ${item.checked ? '✓' : ''}
                        </div>
                        <div class="item-label ${item.checked ? 'done' : ''}">${item.label}</div>
                    </div>
                    ${item.isMoney ? `
                        <div class="amount-container">
                            <input type="number" step="0.5" class="amount-input" value="${item.amount}" 
                                   onchange="updateAmount(${item.originalIndex}, this.value)">
                            <span class="currency">€</span>
                        </div>
                    ` : ''}
                `;
                card.appendChild(row);
            });

            container.appendChild(card);
        }

        document.getElementById('totalMonth').textContent = formatMoney(totalMonth);
        document.getElementById('totalPaid').textContent = formatMoney(totalPaid);
        document.getElementById('totalPending').textContent = formatMoney(totalPending);
    }

    function formatMoney(val) {
        return val.toFixed(2).replace('.', ',') + ' €';
    }

    function toggleCheck(index) {
        const key = getMonthKey();
        db[key][index].checked = !db[key][index].checked;
        saveDB();
        render();
    }

    function updateAmount(index, val) {
        const key = getMonthKey();
        db[key][index].amount = parseFloat(val) || 0;
        saveDB();
        render();
    }

    function changeMonth(offset) {
        currentDate.setMonth(currentDate.getMonth() + offset);
        render();
    }

    function addExtraItem() {
        const label = prompt('Nombre del gasto o tarea extra:');
        if (!label) return;
        const amountStr = prompt('Importe a cargo de Claudia (€) [Deja 0 si es solo tarea]:', '0');
        const amount = parseFloat(amountStr) || 0;

        const key = getMonthKey();
        db[key].push({
            id: 'extra_' + Date.now(),
            cat: '➕ Gastos Extra / Varios',
            label: label,
            amount: amount,
            isMoney: amount > 0,
            checked: false
        });

        saveDB();
        render();
    }

    function resetMonth() {
        if (confirm('¿Restablecer esta checklist al estado inicial del mes?')) {
            const key = getMonthKey();
            delete db[key];
            render();
        }
    }

    function sendWhatsApp() {
        const key = getMonthKey();
        const items = db[key];
        const options = { month: 'long', year: 'numeric' };
        const monthName = currentDate.toLocaleDateString('es-ES', options);

        let okList = [];
        let pendingList = [];
        let pendingTotal = 0;
        let monthTotal = 0;

        items.forEach(item => {
            const amt = parseFloat(item.amount) || 0;
            if (item.isMoney && amt > 0) {
                monthTotal += amt;
                if (item.checked) {
                    okList.push(`  • ${item.label}: *${formatMoney(amt)}*`);
                } else {
                    pendingList.push(`  • ${item.label}: *${formatMoney(amt)}*`);
                    pendingTotal += amt;
                }
            } else if (!item.isMoney) {
                if (item.checked) {
                    okList.push(`  • ${item.label}`);
                } else {
                    pendingList.push(`  • ${item.label}`);
                }
            }
        });

        let msg = `📊 *Economía CDMO - ${monthName}*\n\n`;

        if (okList.length > 0) {
            msg += `✅ *PAGADO / COMPROBADO:*\n${okList.join('\n')}\n\n`;
        }

        if (pendingList.length > 0) {
            msg += `⏳ *PENDIENTE:*\n${pendingList.join('\n')}\n\n`;
        }

        msg += `───────────────\n`;
        msg += `💰 *Total Mes Claudia:* ${formatMoney(monthTotal)}\n`;
        msg += `⚠️ *PENDIENTE DE PAGO:* *${formatMoney(pendingTotal)}*`;

        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    render();
</script>
    
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
