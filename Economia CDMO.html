<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Economía CDMO</title>
    <style>
        * { box-sizing: border-box; }
        :root { --bg-grad: linear-gradient(180deg, #000000 0%, #121212 100%); --card-bg: rgba(28, 28, 30, 0.7); --card-border: rgba(255, 255, 255, 0.12); --card-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.5); --text-main: #ffffff; --text-sub: #8e8e93; --accent-green: #30d158; --accent-green-glow: rgba(48, 209, 88, 0.2); --accent-blue: #0a84ff; --accent-purple: #bf5af2; --neutral-bg: rgba(255, 255, 255, 0.08); --input-bg: rgba(44, 44, 46, 0.8); }
        [data-theme="light"] { --bg-grad: linear-gradient(180deg, #f2f2f7 0%, #e5e5ea 100%); --card-bg: rgba(255, 255, 255, 0.8); --card-border: rgba(255, 255, 255, 0.9); --card-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.06); --text-main: #000000; --text-sub: #8e8e93; --accent-green: #34c759; --accent-green-glow: rgba(52, 199, 89, 0.18); --accent-blue: #007aff; --accent-purple: #af52de; --neutral-bg: rgba(0, 0, 0, 0.04); --input-bg: rgba(255, 255, 255, 0.9); }
        html { background: var(--bg-grad); background-attachment: fixed; min-height: 100%; }
        body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: var(--text-main); margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px max(30px, env(safe-area-inset-bottom)); min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; transition: background 0.4s ease, color 0.4s ease; }
        .container { max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 16px; padding-bottom: 30px; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .header-title { font-size: 1.25rem; font-weight: 800; margin: 0; background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
        .bar-actions { display: flex; gap: 6px; }
        .theme-toggle, .notif-btn { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 50px; padding: 6px 12px; cursor: pointer; backdrop-filter: blur(20px); box-shadow: var(--card-shadow); font-size: 0.82rem; font-weight: 700; display: flex; align-items: center; gap: 4px; color: var(--text-main); flex-shrink: 0; }
        
        /* Pestañas de Vista (Mes / Anual) */
        .view-nav { display: flex; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 4px; gap: 4px; backdrop-filter: blur(20px); }
        .view-btn { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-sub); font-weight: 700; font-size: 0.8rem; border-radius: 14px; cursor: pointer; transition: all 0.25s ease; text-align: center; }
        .view-btn.active { background: var(--accent-blue); color: #ffffff; box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3); }

        .glass-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 16px; backdrop-filter: blur(25px); box-shadow: var(--card-shadow); transition: all 0.3s ease; width: 100%; }
        .month-selector { display: flex; align-items: center; justify-content: space-between; }
        .month-btn { background: var(--neutral-bg); border: 1px solid var(--card-border); color: var(--text-main); font-size: 1.2rem; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .month-title { font-weight: 800; font-size: 1.1rem; text-transform: capitalize; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-bubble { background: var(--neutral-bg); border-radius: 18px; padding: 12px; text-align: center; border: 1px solid var(--card-border); }
        .stat-bubble.highlight { grid-column: span 2; background: var(--accent-green-glow); border-color: var(--accent-green); }
        .stat-label { font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-value { font-size: 1.35rem; font-weight: 800; }
        .stat-value.total-green { color: var(--accent-green); font-size: 1.75rem; }
        .category-title { font-size: 0.85rem; font-weight: 800; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--card-border); gap: 8px; }
        .item-row:last-child { border-bottom: none; }
        .item-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .checkbox-custom { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--card-border); background: var(--neutral-bg); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; flex-shrink: 0; }
        .checkbox-custom.checked { background: var(--accent-green); border-color: var(--accent-green); color: #fff; }
        .item-label { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-amount-input { width: 96px; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 10px; padding: 6px 6px; text-align: right; font-weight: 700; font-size: 16px; flex-shrink: 0; }
        .add-extra-form { display: flex; gap: 6px; margin-top: 10px; width: 100%; }
        .input-extra { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 12px; padding: 8px; font-size: 16px; font-weight: 600; min-width: 0; width: 100%; }
        .btn-add { background: var(--accent-blue); color: #fff; border: none; border-radius: 12px; padding: 0 12px; font-weight: 800; cursor: pointer; flex-shrink: 0; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { flex: 1; padding: 14px; border-radius: 20px; border: 1px solid var(--card-border); font-weight: 800; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: var(--card-shadow); }
        .btn-whatsapp { background: #25D366; color: #000; min-width: 45%; }
        .btn-pdf { background: var(--accent-purple); color: #fff; min-width: 45%; }
        .btn-reset { background: var(--neutral-bg); color: var(--text-sub); width: 100%; }

        .card-title { font-size: 0.85rem; font-weight: 800; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .breakdown-item { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--card-border); font-size: 0.85rem; }
        .breakdown-item:last-child { border-bottom: none; }
        .hint { font-size: 0.72rem; color: var(--text-sub); margin: 0 0 12px; }

        /* Vistas Panel */
        .panel-view { display: none; flex-direction: column; gap: 16px; }
        .panel-view.active { display: flex; }

        /* Modal Settings */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 24px; width: 100%; max-width: 340px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .form-label { font-size: 0.8rem; font-weight: 700; color: var(--text-sub); }

        @media print {
            body { background: #ffffff !important; color: #000000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .top-bar, .month-selector, .actions, .modal-overlay, .view-nav { display: none !important; }
            #addExtraCard { display: none !important; }
            .glass-card { background: none !important; border: 1px solid #ccc !important; box-shadow: none !important; margin-bottom: 20px; break-inside: avoid; color: #000 !important; }
            .stat-bubble { background: #f4f4f5 !important; border: 1px solid #ccc !important; }
            .stat-bubble.highlight { background: rgba(48, 209, 88, 0.1) !important; border-color: #30d158 !important; }
            .stat-value.total-green { color: #000 !important; }
            .category-title { color: #000 !important; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
            .item-amount-input { background: transparent !important; color: #000 !important; border: none !important; border-bottom: 1px dashed #999 !important; border-radius: 0; }
            .checkbox-custom { border-color: #999 !important; }
            .checkbox-custom.checked { background: #34c759 !important; border-color: #34c759 !important; color: #fff !important; }
            .header-title, .month-title { color: #000 !important; -webkit-text-fill-color: #000 !important; }
            h2.print-title { display: block !important; text-align: center; margin-bottom: 15px; font-size: 1.5rem; color: #000; }
        }
        h2.print-title { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1 class="header-title">📊 Economía CDMO</h1>
        <div class="bar-actions">
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </div>
    
    <h2 class="print-title" id="printTitle">Economía Familiar CDMO</h2>

    <div class="view-nav">
        <button class="view-btn active" id="btn_viewMonth" onclick="switchView('month')">📅 Vista Mensual</button>
        <button class="view-btn" id="btn_viewYear" onclick="switchView('year')">📈 Balance Anual</button>
    </div>

    <div class="panel-view active" id="viewMonth">
        <div class="glass-card month-selector">
            <button class="month-btn" onclick="changeMonth(-1)">‹</button>
            <div class="month-title" id="monthTitle">-- ----</div>
            <button class="month-btn" onclick="changeMonth(1)">›</button>
        </div>

        <div class="glass-card summary-grid">
            <div class="stat-bubble"><div class="stat-label">Total Gastos</div><div class="stat-value" id="totalGastos">0,00 €</div></div>
            <div class="stat-bubble"><div class="stat-label">Pagados / Listos</div><div class="stat-value" id="totalPagados" style="color: var(--accent-blue);">0,00 €</div></div>
            <div class="stat-bubble highlight"><div class="stat-label">Parte Claudia (Reparto)</div><div class="stat-value total-green" id="parteClaudia">0,00 €</div></div>
        </div>

        <div class="glass-card" id="addExtraCard">
            <div class="category-title">➕ Añadir Concepto Extra</div>
            <div class="add-extra-form">
                <input type="text" id="extraName" class="input-extra name" placeholder="Ej: Farmacia, Regalo...">
                <input type="number" id="extraAmount" class="input-extra amount" inputmode="decimal" placeholder="0.00" step="0.01">
                <button class="btn-add" onclick="addExtraItem()">OK</button>
            </div>
        </div>

        <div id="categoriesContainer"></div>

        <div class="actions">
            <button class="btn-action btn-pdf" onclick="exportPDF('month')">📄 PDF</button>
            <button class="btn-action btn-whatsapp" onclick="sendWhatsApp()">💬 Desglose</button>
            <button class="btn-action btn-reset" onclick="resetMonth()">🔄 Limpiar</button>
        </div>
    </div>

    <div class="panel-view" id="viewYear">
        <div class="glass-card month-selector">
            <button class="month-btn" onclick="changeYear(-1)">‹</button>
            <div class="month-title" id="yearTitle">----</div>
            <button class="month-btn" onclick="changeYear(1)">›</button>
        </div>

        <div class="glass-card summary-grid">
            <div class="stat-bubble highlight">
                <div class="stat-label">Total Gastos del Año</div>
                <div class="stat-value total-green" id="yearTotalGastos">0,00 €</div>
            </div>
            <div class="stat-bubble" style="grid-column: span 2;">
                <div class="stat-label">Acumulado Parte Claudia (50%)</div>
                <div class="stat-value" id="yearTotalClaudia" style="color: var(--accent-purple);">0,00 €</div>
            </div>
        </div>

        <div class="glass-card">
            <div class="card-title" style="margin-bottom:8px;">📊 Desglose por Categorías</div>
            <div class="breakdown-list" id="yearCategoriesList"></div>
        </div>

        <div class="actions">
            <button class="btn-action btn-pdf" onclick="exportPDF('year')">📄 PDF Anual</button>
            <button class="btn-action btn-whatsapp" onclick="sendYearWhatsApp()">💬 Resumen Anual</button>
        </div>
    </div>
</div>

    /* ===== Utilidades ===== */
    const $ = id => document.getElementById(id);
    const fmt = n => { n = isFinite(n) ? n : 0; const p = Math.abs(n).toFixed(2).split('.'); return (n < 0 && +p.join('') ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1] + ' €'; };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
    const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    // Día 1 siempre: evita que "mes siguiente" salte un mes cuando hoy es 29, 30 o 31
    let currentDate = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); })();
    let currentYear = new Date().getFullYear();
    let currentView = 'month';

    const DEFAULT_ITEMS = [
        { id: 'v_hipoteca', cat: '🏠 Vivienda y Suministros', label: 'Hipoteca / Alquiler', amount: 0.00, isClaudia: true },
        { id: 'v_luz', cat: '🏠 Vivienda y Suministros', label: 'Luz (Factura)', amount: 0.00, isClaudia: true },
        { id: 'v_agua', cat: '🏠 Vivienda y Suministros', label: 'Agua', amount: 0.00, isClaudia: true },
        { id: 'v_internet', cat: '🏠 Vivienda y Suministros', label: 'Internet / Fibra', amount: 0.00, isClaudia: true },
        { id: 'o_comedor', cat: '👧 Gastos Olivia', label: 'Comedor Escolar', amount: 0.00, isClaudia: true },
        { id: 'o_extra', cat: '👧 Gastos Olivia', label: 'Actividades / Varios', amount: 0.00, isClaudia: true },
        { id: 's_suscripciones', cat: '📺 Suscripciones y Servicios', label: 'Plataformas TV / Streaming', amount: 0.00, isClaudia: true },
        { id: 's_seguros', cat: '🛡️ Seguros y Gastos Fijos', label: 'Seguros', amount: 0.00, isClaudia: true }
    ];

    let db = {}; try { db = JSON.parse(localStorage.getItem('economia_cdmo_db')) || {}; } catch (e) { db = {}; }
    function saveDB() { lsSet('economia_cdmo_db', JSON.stringify(db)); }

    /* ===== Tema / vistas ===== */
    function initTheme() { const t = lsGet('theme_preference', 'dark'); document.documentElement.setAttribute('data-theme', t); $('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️'; }
    function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); lsSet('theme_preference', t); $('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️'; }
    function switchView(view) {
        currentView = view;
        $('viewMonth').classList.toggle('active', view === 'month'); $('viewYear').classList.toggle('active', view === 'year');
        $('btn_viewMonth').classList.toggle('active', view === 'month'); $('btn_viewYear').classList.toggle('active', view === 'year');
        if (view === 'year') renderYear(); else renderMonth();
    }

    /* ===== Vista mensual ===== */
    function getMonthKey(d) { d = d || currentDate; return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
    function monthLabel(d) { d = d || currentDate; return MESES[d.getMonth()] + ' ' + d.getFullYear(); }
    function initMonthData() {
        const key = getMonthKey();
        if (!db[key] || !Array.isArray(db[key].items)) db[key] = { items: JSON.parse(JSON.stringify(DEFAULT_ITEMS)), checked: {} };
        if (!db[key].checked) db[key].checked = {};
        saveDB();
    }
    function groupByCat(items) { const c = {}; (items || []).forEach(it => { (c[it.cat] = c[it.cat] || []).push(it); }); return c; }
    function monthTotals(md) {
        let total = 0, pagado = 0, claudia = 0;
        (md.items || []).forEach(it => { const a = parseFloat(it.amount) || 0; total += a; if (md.checked && md.checked[it.id]) pagado += a; if (it.isClaudia) claudia += a / 2; });
        return { total, pagado, claudia };
    }
    function renderMonth() {
        initMonthData(); const key = getMonthKey(), md = db[key];
        $('monthTitle').textContent = monthLabel();
        $('printTitle').textContent = 'Economía Familiar CDMO - ' + monthLabel();
        const container = $('categoriesContainer'); container.innerHTML = '';
        for (const [catName, items] of Object.entries(groupByCat(md.items))) {
            const card = document.createElement('div'); card.className = 'glass-card'; card.style.marginBottom = '16px';
            let html = `<div class="category-title">${esc(catName)}</div>`;
            items.forEach(item => {
                const isChecked = !!(md.checked && md.checked[item.id]), amount = parseFloat(item.amount) || 0;
                html += `<div class="item-row"><div class="item-left"><div class="checkbox-custom ${isChecked ? 'checked' : ''}" onclick="toggleCheck('${esc(item.id)}')">${isChecked ? '✓' : ''}</div><span class="item-label">${esc(item.label)}</span></div><input type="number" inputmode="decimal" class="item-amount-input" value="${amount || ''}" placeholder="0.00" step="0.01" onchange="updateAmount('${esc(item.id)}', this.value)"></div>`;
            });
            card.innerHTML = html; container.appendChild(card);
        }
        const t = monthTotals(md);
        $('totalGastos').textContent = fmt(t.total); $('totalPagados').textContent = fmt(t.pagado); $('parteClaudia').textContent = fmt(t.claudia);
    }
    function toggleCheck(id) { const key = getMonthKey(); if (!db[key].checked) db[key].checked = {}; db[key].checked[id] = !db[key].checked[id]; saveDB(); renderMonth(); }
    function updateAmount(id, val) { const item = db[getMonthKey()].items.find(i => i.id === id); if (item) { item.amount = parseFloat(val) || 0; saveDB(); renderMonth(); } }
    function addExtraItem() {
        const n = $('extraName').value.trim(), a = parseFloat($('extraAmount').value) || 0; if (!n) return;
        initMonthData();
        db[getMonthKey()].items.push({ id: 'extra_' + Date.now(), cat: '⚡ Extras y Varios', label: n, amount: a, isClaudia: true });
        $('extraName').value = ''; $('extraAmount').value = ''; saveDB(); renderMonth();
    }
    function changeMonth(offset) { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1); renderMonth(); }
    function resetMonth() { if (confirm('¿Borrar y reiniciar los datos de este mes?')) { db[getMonthKey()] = { items: JSON.parse(JSON.stringify(DEFAULT_ITEMS)), checked: {} }; saveDB(); renderMonth(); } }

    /* ===== Vista anual ===== */
    function yearData(year) {
        const months = Array(12).fill(null).map(() => ({ total: 0, claudia: 0 })), cats = {}; let total = 0, claudia = 0;
        for (const [key, data] of Object.entries(db)) {
            if (!key.startsWith(year + '-') || !data || !Array.isArray(data.items)) continue;
            const mi = parseInt(key.slice(5, 7), 10) - 1; if (!(mi >= 0 && mi < 12)) continue;
            data.items.forEach(it => {
                const a = parseFloat(it.amount) || 0; total += a; months[mi].total += a;
                if (it.isClaudia) { claudia += a / 2; months[mi].claudia += a / 2; }
                cats[it.cat] = (cats[it.cat] || 0) + a;
            });
        }
        return { total, claudia, cats, months };
    }
    function changeYear(offset) { currentYear += offset; renderYear(); }
    function renderYear() {
        $('yearTitle').textContent = 'Año ' + currentYear;
        $('printTitle').textContent = 'Balance Anual Economía CDMO - ' + currentYear;
        const y = yearData(currentYear);
        $('yearTotalGastos').textContent = fmt(y.total); $('yearTotalClaudia').textContent = fmt(y.claudia);
        const listEl = $('yearCategoriesList');
        if (!Object.keys(y.cats).length) { listEl.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:10px;">No hay registros para este año.</div>'; return; }
        listEl.innerHTML = Object.entries(y.cats).map(([c, s]) => `<div class="breakdown-item"><span>${esc(c)}:</span><strong style="color:var(--accent-blue);">${fmt(s)}</strong></div>`).join('');
    }

    /* ===== WhatsApp ===== */
    function openWA(text) { window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank'); }
    function sendWhatsApp() {
        initMonthData(); const md = db[getMonthKey()], t = monthTotals(md);
        let text = `📊 *Resumen Gastos CDMO - ${monthLabel()}*\n\n`;
        (md.items || []).forEach(i => { const a = parseFloat(i.amount) || 0; if (a > 0) text += `${md.checked && md.checked[i.id] ? '✅' : '⏳'} ${i.label}: *${fmt(a)}*\n`; });
        text += `\n💰 *Total:* ${fmt(t.total)}\n👧 *Claudia (50%):* ${fmt(t.claudia)}`;
        openWA(text);
    }
    function sendYearWhatsApp() {
        const y = yearData(currentYear);
        openWA(`📈 *Balance Anual Economía CDMO - ${currentYear}*\n\n💰 *Total Gastos del Año:* ${fmt(y.total)}\n👧 *Acumulado Claudia (50%):* ${fmt(y.claudia)}`);
    }

    /* ===== PDF (sin window.print: funciona también en la app de la pantalla de inicio de iOS) ===== */
    function pdfMonth() {
        initMonthData(); const md = db[getMonthKey()], t = monthTotals(md);
        const d = new MiniPDF.Doc({ title: 'Economía familiar CDMO - ' + monthLabel(), footer: 'Economía CDMO · ' + monthLabel() });
        d.heading('Economía familiar CDMO', monthLabel());
        d.kv('Total gastos', fmt(t.total), { bold: true }); d.kv('Pagados / listos', fmt(t.pagado)); d.kv('Pendiente de pagar', fmt(t.total - t.pagado));
        d.big('Parte Claudia (50 %)', fmt(t.claudia));
        for (const [cat, items] of Object.entries(groupByCat(md.items))) {
            d.section(cat);
            let sub = 0;
            const rows = items.map(it => { const a = parseFloat(it.amount) || 0; sub += a; return { c: [it.label, md.checked && md.checked[it.id] ? 'Pagado' : 'Pendiente', fmt(a)], dim: a === 0 }; });
            rows.push({ c: ['Subtotal', '', fmt(sub)], bold: true, sep: true });
            d.table([{ h: 'Concepto', w: .56 }, { h: 'Estado', w: .2 }, { h: 'Importe', w: .24, a: 'r' }], rows);
        }
        return { blob: d.build(), name: 'economia-' + getMonthKey() + '.pdf' };
    }
    function pdfYear() {
        const y = yearData(currentYear);
        const d = new MiniPDF.Doc({ title: 'Balance anual economía CDMO ' + currentYear, footer: 'Economía CDMO · Balance ' + currentYear });
        d.heading('Balance anual · Economía CDMO', 'Año ' + currentYear);
        d.kv('Total gastos del año', fmt(y.total), { bold: true });
        d.big('Acumulado parte Claudia (50 %)', fmt(y.claudia));
        d.section('Desglose por categorías');
        const crow = Object.entries(y.cats).map(([c, s]) => ({ c: [c, fmt(s)] }));
        if (!crow.length) crow.push({ c: ['Sin registros este año', ''], dim: true }); else crow.push({ c: ['Total', fmt(y.total)], bold: true, sep: true });
        d.table([{ h: 'Categoría', w: .7 }, { h: 'Importe', w: .3, a: 'r' }], crow);
        d.section('Evolución por meses');
        const mrow = y.months.map((m, i) => ({ c: [MESES[i], fmt(m.total), fmt(m.claudia)], dim: m.total === 0 }));
        mrow.push({ c: ['Total', fmt(y.total), fmt(y.claudia)], bold: true, sep: true });
        d.table([{ h: 'Mes', w: .4 }, { h: 'Gastos', w: .3, a: 'r' }, { h: 'Parte Claudia', w: .3, a: 'r' }], mrow);
        return { blob: d.build(), name: 'economia-balance-' + currentYear + '.pdf' };
    }
    function exportPDF(kind) {
        try {
            const doc = kind === 'year' ? pdfYear() : pdfMonth();
            MiniPDF.deliver(doc.blob, doc.name);
        } catch (e) {
            if (confirm('No se pudo generar el PDF (' + (e && e.message ? e.message : e) + '). ¿Probar con la impresión del sistema?')) window.print();
        }
    }

    initTheme(); renderMonth();

</script>
<script> if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) { navigator.serviceWorker.register('./sw.js').catch(function(){}); } </script>
</body>
</html>
