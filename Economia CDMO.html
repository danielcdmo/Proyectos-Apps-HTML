<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Economía CDMO</title>
    <style>
        :root {
            /* Tema Oscuro Liquid Glass */
            --bg-grad: linear-gradient(145deg, #0b1120 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.55);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --neutral-bg: rgba(255, 255, 255, 0.06);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        [data-theme="light"] {
            /* Tema Claro Liquid Glass */
            --bg-grad: linear-gradient(145deg, #e0f2fe 0%, #f0f9ff 100%);
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.8);
            --card-shadow: 0 10px 30px 0 rgba(148, 163, 184, 0.25);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-green: #059669;
            --accent-green-glow: rgba(5, 150, 105, 0.2);
            --accent-blue: #2563eb;
            --accent-purple: #7c3aed;
            --neutral-bg: rgba(0, 0, 0, 0.04);
            --input-bg: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            background: var(--bg-grad);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .container {
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 30px;
        }

        /* Header con Toggle Claro/Oscuro */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 6px 12px;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        /* Tarjetas Glassmorphism */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 16px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }

        /* Navegador de Mes */
        .month-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .month-btn {
            background: var(--neutral-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .month-title {
            font-weight: 800;
            font-size: 1.15rem;
            text-transform: capitalize;
        }

        /* Resumen de Totales */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-bubble {
            background: var(--neutral-bg);
            border-radius: 18px;
            padding: 12px;
            text-align: center;
            border: 1px solid var(--card-border);
        }

        .stat-bubble.highlight {
            grid-column: span 2;
            background: var(--accent-green-glow);
            border-color: var(--accent-green);
        }

            font-size: 0.
