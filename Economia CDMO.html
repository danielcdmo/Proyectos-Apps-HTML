<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Economía CDMO</title>
    <style>
        :root {
            /* Tema Oscuro iOS OLED Neutro */
            --bg-grad: linear-gradient(180deg, #000000 0%, #121212 100%);
            --card-bg: rgba(28, 28, 30, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.5);
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --accent-green: #30d158;
            --accent-green-glow: rgba(48, 209, 88, 0.2);
            --accent-blue: #0a84ff;
            --accent-purple: #bf5af2;
            --neutral-bg: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(44, 44, 46, 0.8);
        }

        [data-theme="light"] {
            /* Tema Claro iOS Neutro */
            --bg-grad: linear-gradient(180deg, #f2f2f7 0%, #e5e5ea 100%);
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(255, 255, 255, 0.9);
            --card-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.06);
            --text-main: #000000;
            --text-sub: #8e8e93;
            --accent-green: #34c759;
            --accent-green-glow: rgba(52, 199, 89, 0.18);
            --accent-blue: #007aff;
            --accent-purple: #af52de;
            --neutral-bg: rgba(0, 0, 0, 0.04);
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            background: var(--bg-grad);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .container {
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 30px;
        }

        /* Header con Toggle Claro/Oscuro */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 6px 14px;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        /* Tarjetas Glassmorphism */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 16px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }

        /* Navegador de Mes */
        .month-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .month-btn {
            background: var(--neutral-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .month-title {
            font-weight: 800;
            font-size: 1.15rem;
            text-transform: capitalize;
        }

        /* Resumen de Totales */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-bubble {
            background: var(--neutral-bg);
            border-radius: 18px;
            padding: 12px;
            text-align: center;
            border: 1px solid var(--card-border);
        }

        .stat-bubble.highlight {
            grid-column: span 2;
            background: var(--accent-green-glow);
            border-color: var(--accent-green);
        }

        .stat-label {
            font-size: 0.72rem;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
        }

        .stat-value.total-green {
            color: var(--accent-green);
            font-size: 1.8rem;
        }

        /* Categorías y Lista de Gastos */
        .category-title {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--card-border);
            gap: 10px;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .checkbox-custom {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            border: 2px solid var(--card-border);
            background: var(--neutral-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .checkbox-custom.checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
        }

        .item-label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .item-amount-input {
            width: 80px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 6px 8px;
            text-align: right;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* Formulario Añadir Extra */
        .add-extra-form {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .input-extra {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 10px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-extra.name { flex: 2; }
        .input-extra.amount { flex: 1; text-align: right; }

        .btn-add {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0 14px;
            font-weight: 800;
            cursor: pointer;
        }

        /* Botones de Acción */
        .actions {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            flex: 1;
            padding: 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
        }

        .btn-whatsapp {
            background: #25D366;
            color: #000;
        }

        .btn-reset {
            background: var(--neutral-bg);
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1 class="header-title">📊 Economía CDMO</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Oscuro</button>
    </div>

    <div class="glass-card month-selector">
        <button class="month-btn" onclick="changeMonth(-1)">‹</button>
        <div class="month-title" id="monthTitle">-- ----</div>
        <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>

    <div class="glass-card summary-grid">
        <div class="stat-bubble">
            <div class="stat-label">Total Gastos</div>
            <div class="stat-value" id="totalGastos">0,00 €</div>
        </div>
        <div class="stat-bubble">
            <div class="stat-label">Pagados / Listos</div>
            <div class="stat-value" id="totalPagados" style="color: var(--accent-blue);">0,00 €</div>
        </div>
        <div class="stat-bubble highlight">
            <div class="stat-label">Parte Claudia (Reparto)</div>
            <div class="stat-value total-green" id="parteClaudia">0,00 €</div>
        </div>
    </div>

    <div class="glass-card">
        <div class="category-title">➕ Añadir Concepto Extra</div>
        <div class="add-extra-form">
            <input type="text" id="extraName" class="input-extra name" placeholder="Ej: Farmacia, Regalo...">
            <input type="number" id="extraAmount" class="input-extra amount" placeholder="0.00" step="0.01">
            <button class="btn-add" onclick="addExtraItem()">OK</button>
        </div>
    </div>

    <div id="categoriesContainer"></div>

    <div class="actions">
        <button class="btn-action btn-whatsapp" onclick="sendWhatsApp()">
            💬 Enviar Desglose
        </button>
        <button class="btn-action btn-reset" onclick="resetMonth()">
            🔄 Limpiar
        </button>
    </div>
</div>

<script>
    let currentDate = new Date();
    
    // Plantilla Fija de Gastos Base
    const DEFAULT_ITEMS = [
        { id: 'v_hipoteca', cat: '🏠 Vivienda y Suministros', label: 'Hipoteca / Alquiler', amount: 0.00, isClaudia: true },
        { id: 'v_luz', cat: '🏠 Vivienda y Suministros', label: 'Luz (Factura)', amount: 0.00, isClaudia: true },
        { id: 'v_agua', cat: '🏠 Vivienda y Suministros', label: 'Agua', amount: 0.00, isClaudia: true },
        { id: 'v_internet', cat: '🏠 Vivienda y Suministros', label: 'Internet / Fibra', amount: 0.00, isClaudia: true },
        
        { id: 'o_comedor', cat: '👧 Gastos Olivia', label: 'Comedor Escolar', amount: 0.00, isClaudia: true },
        { id: 'o_extra', cat: '👧 Gastos Olivia', label: 'Actividades / Varios', amount: 0.00, isClaudia: true },
        
        { id: 's_suscripciones', cat: '📺 Suscripciones y Servicios', label: 'Plataformas TV / Streaming', amount: 0.00, isClaudia: true },
        { id: 's_seguros', cat: '🛡️ Seguros y Gastos Fijos', label: 'Seguros', amount: 0.00, isClaudia: true }
    ];

    let db = {};
    try {
        db = JSON.parse(localStorage.getItem('economia_cdmo_db')) || {};
    } catch(e) {
        db = {};
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme_preference') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeBtn(savedTheme);
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme_preference', newTheme);
        updateThemeBtn(newTheme);
    }

    function updateThemeBtn(theme) {
        document.getElementById('themeBtn').textContent = theme === 'dark' ? '🌙 Oscuro' : '☀️ Claro';
    }

    function getMonthKey() {
        const year = currentDate.getFullYear();
        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
        return `${year}-${month}`;
    }

    function initMonthData() {
        const key = getMonthKey();
        if (!db[key] || !Array.isArray(db[key].items)) {
            db[key] = {
                items: JSON.parse(JSON.stringify(DEFAULT_ITEMS)),
                checked: {}
            };
        }
        if (!db[key].checked) {
            db[key].checked = {};
        }
        saveDB();
    }

    function saveDB() {
        localStorage.setItem('economia_cdmo_db', JSON.stringify(db));
    }

    function render() {
        initMonthData();
        const key = getMonthKey();
        const monthData = db[key];

        const options = { month: 'long', year: 'numeric' };
        document.getElementById('monthTitle').textContent = currentDate.toLocaleDateString('es-ES', options);

        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';

        const categories = {};
        if (Array.isArray(monthData.items)) {
            monthData.items.forEach(item => {
                if (!categories[item.cat]) categories[item.cat] = [];
                categories[item.cat].push(item);
            });
        }

        let grandTotal = 0;
        let totalPagado = 0;
        let parteClaudiaTotal = 0;

        for (const [catName, items] of Object.entries(categories)) {
            const card = document.createElement('div');
            card.className = 'glass-card';
            card.style.marginBottom = '16px';

            let html = `<div class="category-title">${catName}</div>`;

            items.forEach(item => {
                const isChecked = !!(monthData.checked && monthData.checked[item.id]);
                const amount = parseFloat(item.amount) || 0;
                
                grandTotal += amount;
                if (isChecked) totalPagado += amount;
                if (item.isClaudia) parteClaudiaTotal += (amount / 2);

                html += `
                    <div class="item-row">
                        <div class="item-left">
                            <div class="checkbox-custom ${isChecked ? 'checked' : ''}" onclick="toggleCheck('${item.id}')">
                                ${isChecked ? '✓' : ''}
                            </div>
                            <span class="item-label">${item.label}</span>
                        </div>
                        <input type="number" class="item-amount-input" value="${item.amount || ''}" placeholder="0.00" step="0.01" onchange="updateAmount('${item.id}', this.value)">
                    </div>
                `;
            });

            card.innerHTML = html;
            container.appendChild(card);
        }

        document.getElementById('totalGastos').textContent = `${grandTotal.toFixed(2).replace('.', ',')} €`;
        document.getElementById('totalPagados').textContent = `${totalPagado.toFixed(2).replace('.', ',')} €`;
        document.getElementById('parteClaudia').textContent = `${parteClaudiaTotal.toFixed(2).replace('.', ',')} €`;
    }

    function toggleCheck(id) {
        const key = getMonthKey();
        if (!db[key].checked) db[key].checked = {};
        db[key].checked[id] = !db[key].checked[id];
        saveDB();
        render();
    }

    function updateAmount(id, val) {
        const key = getMonthKey();
        const item = db[key].items.find(i => i.id === id);
        if (item) {
            item.amount = parseFloat(val) || 0;
            saveDB();
            render();
        }
    }

    function addExtraItem() {
        const nameInput = document.getElementById('extraName');
        const amountInput = document.getElementById('extraAmount');

        const name = nameInput.value.trim();
        const amount = parseFloat(amountInput.value) || 0;

        if (!name) return;

        const key = getMonthKey();
        const newId = 'extra_' + Date.now();

        db[key].items.push({
            id: newId,
            cat: '⚡ Extras y Varios',
            label: name,
            amount: amount,
            isClaudia: true
        });

        nameInput.value = '';
        amountInput.value = '';

        saveDB();
        render();
    }

    function changeMonth(offset) {
        currentDate.setMonth(currentDate.getMonth() + offset);
        render();
    }

    function resetMonth() {
        if (confirm('¿Borrar y reiniciar los datos de este mes?')) {
            const key = getMonthKey();
            db[key] = {
                items: JSON.parse(JSON.stringify(DEFAULT_ITEMS)),
                checked: {}
            };
            saveDB();
            render();
        }
    }

    function sendWhatsApp() {
        const options = { month: 'long', year: 'numeric' };
        const monthName = currentDate.toLocaleDateString('es-ES', options);
        const key = getMonthKey();
        const items = db[key].items || [];

        let text = `📊 *Resumen Gastos CDMO - ${monthName}*\n\n`;

        items.forEach(i => {
            if (i.amount > 0) {
                const isChecked = db[key].checked && db[key].checked[i.id] ? '✅' : '⏳';
                text += `${isChecked} ${i.label}: *${i.amount.toFixed(2)} €*\n`;
            }
        });

        const total = document.getElementById('totalGastos').textContent;
        const parteClaudia = document.getElementById('parteClaudia').textContent;

        text += `\n💰 *Total Gastos:* ${total}`;
        text += `\n👧 *Parte Claudia (50%):* ${parteClaudia}`;

        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    initTheme();
    render();
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
