<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Timer Pro</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --green: #22c55e;
      --red: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      padding: 28px 20px;
      border-radius: 24px;
      text-align: center;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    h1 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
    .timer-display {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    button {
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      color: white;
    }
    button:active {
      transform: scale(0.96);
    }
    .btn-start { background: var(--green); }
    .btn-stop { background: var(--red); }
    .btn-lap { background: #0284c7; }
    .btn-reset { background: #475569; }
    .laps {
      max-height: 120px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      color: #94a3b8;
    }
    .lap-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    p {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⏱️ Cronómetro Pro</h1>
    <div id="display" class="timer-display">00:00.0</div>

    <div class="btn-grid">
      <button id="toggleBtn" class="btn-start" onclick="toggle()">Iniciar</button>
      <button class="btn-lap" onclick="lap()">Vuelta</button>
      <button class="btn-reset" onclick="reset()" style="grid-column: span 2;">Reiniciar</button>
    </div>

    <div id="laps" class="laps"></div>
    <p>Test de sincronización automática</p>
  </div>

  <script>
    let timer = null;
    let startTime = 0;
    let elapsedTime = 0;
    let running = false;
    let lapCount = 0;

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      const tenths = Math.floor((ms % 1000) / 100);
      return `${minutes}:${seconds}.${tenths}`;
    }

    function update() {
      const now = Date.now();
      const current = elapsedTime + (now - startTime);
      document.getElementById('display').textContent = formatTime(current);
    }

    function toggle() {
      const btn = document.getElementById('toggleBtn');
      if (window.navigator.vibrate) window.navigator.vibrate(20);

      if (!running) {
        startTime = Date.now();
        timer = setInterval(update, 100);
        running = true;
        btn.textContent = 'Parar';
        btn.className = 'btn-stop';
      } else {
        clearInterval(timer);
        elapsedTime += Date.now() - startTime;
        running = false;
        btn.textContent = 'Iniciar';
        btn.className = 'btn-start';
      }
    }

    function lap() {
      if (!running) return;
      if (window.navigator.vibrate) window.navigator.vibrate(20);
      lapCount++;
      const current = elapsedTime + (Date.now() - startTime);
      const lapsDiv = document.getElementById('laps');
      const item = document.createElement('div');
      item.className = 'lap-item';
      item.innerHTML = `<span>Vuelta ${lapCount}</span><span>${formatTime(current)}</span>`;
      lapsDiv.prepend(item);
    }

    function reset() {
      if (window.navigator.vibrate) window.navigator.vibrate(30);
      clearInterval(timer);
      running = false;
      elapsedTime = 0;
      lapCount = 0;
      document.getElementById('display').textContent = '00:00.0';
      document.getElementById('toggleBtn').textContent = 'Iniciar';
      document.getElementById('toggleBtn').className = 'btn-start';
      document.getElementById('laps').innerHTML = '';
    }
  </script>
</body>
</html>
