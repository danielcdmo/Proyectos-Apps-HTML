<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Prueba Sync Auto</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      padding: 32px 24px;
      border-radius: 24px;
      text-align: center;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    h1 {
      font-size: 1.2rem;
      color: var(--accent);
      margin-bottom: 24px;
    }
    .dice {
      font-size: 5rem;
      font-weight: 800;
      margin: 20px 0;
      transition: transform 0.15s ease;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
    button:active {
      transform: scale(0.96);
      background: #0369a1;
    }
    p {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Sync Automático OK</h1>
    <div id="dice" class="dice">🎲</div>
    <button onclick="tirar()">Tirar Dado</button>
    <p>Subido automáticamente desde iCloud</p>
  </div>

  <script>
    function tirar() {
      const el = document.getElementById('dice');
      const num = Math.floor(Math.random() * 6) + 1;
      el.style.transform = 'scale(0.8) rotate(20deg)';
      setTimeout(() => {
        el.textContent = num;
        el.style.transform = 'scale(1) rotate(0deg)';
      }, 100);
      if (window.navigator.vibrate) window.navigator.vibrate(30);
    }
  </script>
</body>
</html>
