<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Comedor Olivia</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --green-yes: #10b981;
            --red-no: #ef4444;
            --neutral-bg: rgba(51, 65, 85, 0.5);
            --accent-blue: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 4px 0;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Selector de Mes */
        .month-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 8px 16px;
            backdrop-filter: blur(12px);
        }

        .month-btn {
            background: var(--neutral-bg);
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
        }

        .month-title {
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: capitalize;
        }

        /* Tarjeta de Resumen */
        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            backdrop-filter: blur(12px);
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-box.total {
            grid-column: span 2;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
        }

        .stat-value.total-val {
            color: var(--green-yes);
            font-size: 1.8rem;
        }

        .price-config {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .price-input {
            width: 60px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 6px;
            padding: 2px 6px;
            text-align: center;
            font-weight: 700;
        }

        /* Grid del Calendario */
        .calendar-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(12px);
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-btn {
            aspect-ratio: 1;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--neutral-bg);
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .day-btn.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .day-btn.weekend {
            opacity: 0.35;
        }

        .day-btn.yes {
            background: var(--green-yes);
            color: #000;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .day-btn.no {
            background: var(--red-no);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .day-status {
            font-size: 0.6rem;
            margin-top: 2px;
            font-weight: 800;
        }

        /* Acciones */
        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-whatsapp {
            background: #25D366;
            color: #000;
        }

        .btn-reset {
            background: var(--neutral-bg);
            color: var(--text-sub);
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🍱 Comedor Olivia</h1>
    </div>

    <!-- Navegación de Mes -->
    <div class="month-selector">
        <button class="month-btn" onclick="changeMonth(-1)">‹</button>
        <div class="month-title" id="monthTitle">-- ----</div>
        <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>

    <!-- Resumen Económico -->
    <div class="summary-card">
        <div class="stat-box">
            <div class="stat-label">Días Asiste</div>
            <div class="stat-value" id="countYes" style="color: var(--green-yes);">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Días No Asiste</div>
            <div class="stat-value" id="countNo" style="color: var(--red-no);">0</div>
        </div>
        <div class="stat-box total">
            <div class="stat-label">Total Mes a Pagar</div>
            <div class="stat-value total-val" id="totalAmount">0,00 €</div>
            <div class="price-config">
                <span>Precio/menú:</span>
                <input type="number" id="priceInput" class="price-input" value="8.90" step="0.10" onchange="updatePrice(this.value)"> €
            </div>
        </div>
    </div>

    <!-- Calendario -->
    <div class="calendar-card">
        <div class="weekdays-grid">
            <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <!-- Acciones -->
    <div class="actions">
        <button class="btn-action btn-whatsapp" onclick="sendWhatsApp()">
            💬 Enviar Resumen
        </button>
        <button class="btn-action btn-reset" onclick="resetMonth()">
            🔄 Limpiar Mes
        </button>
    </div>
</div>

<script>
    let currentDate = new Date();
    let pricePerMenu = 8.90;
    // Estructura de memoria: { "YYYY-MM": { price: 8.90, days: { "1": "yes", "2": "no" } } }
    let db = JSON.parse(localStorage.getItem('comedor_olivia_db')) || {};

    function getMonthKey() {
        const year = currentDate.getFullYear();
        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
        return `${year}-${month}`;
    }

    function initMonthData() {
        const key = getMonthKey();
        if (!db[key]) {
            db[key] = {
                price: pricePerMenu,
                days: {}
            };
        } else if (db[key].price) {
            pricePerMenu = db[key].price;
        }
        document.getElementById('priceInput').value = pricePerMenu;
        saveDB();
    }

    function saveDB() {
        localStorage.setItem('comedor_olivia_db', JSON.stringify(db));
    }

    function render() {
        initMonthData();
        const key = getMonthKey();
        const monthData = db[key].days;

        // Render título del mes
        const options = { month: 'long', year: 'numeric' };
        document.getElementById('monthTitle').textContent = currentDate.toLocaleDateString('es-ES', options);

        // Render días del mes
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Ajustar Lunes=0
        const totalDays = new Date(year, month + 1, 0).getDate();

        // Huecos vacíos inicio de mes
        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-btn empty';
            grid.appendChild(emptyCell);
        }

        let yesCount = 0;
        let noCount = 0;

        // Días reales
        for (let day = 1; day <= totalDays; day++) {
            const btn = document.createElement('button');
            btn.className = 'day-btn';
            
            const dateObj = new Date(year, month, day);
            const dayOfWeek = dateObj.getDay();
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

            if (isWeekend) {
                btn.classList.add('weekend');
            }

            const state = monthData[day]; // "yes", "no" or undefined

            let labelHtml = `<span>${day}</span>`;

            if (state === 'yes') {
                btn.classList.add('yes');
                labelHtml += `<span class="day-status">SÍ</span>`;
                yesCount++;
            } else if (state === 'no') {
                btn.classList.add('no');
                labelHtml += `<span class="day-status">NO</span>`;
                noCount++;
            }

            btn.innerHTML = labelHtml;

            btn.onclick = () => toggleDay(day);
            grid.appendChild(btn);
        }

        // Actualizar Estadísticas
        document.getElementById('countYes').textContent = yesCount;
        document.getElementById('countNo').textContent = noCount;
        
        const totalAmount = (yesCount * pricePerMenu).toFixed(2);
        document.getElementById('totalAmount').textContent = `${totalAmount.replace('.', ',')} €`;
    }

    function toggleDay(day) {
        const key = getMonthKey();
        const currentStates = db[key].days;

        if (!currentStates[day]) {
            currentStates[day] = 'yes';
        } else if (currentStates[day] === 'yes') {
            currentStates[day] = 'no';
        } else {
            delete currentStates[day];
        }

        saveDB();
        render();
    }

    function changeMonth(offset) {
        currentDate.setMonth(currentDate.getMonth() + offset);
        render();
    }

    function updatePrice(val) {
        pricePerMenu = parseFloat(val) || 0;
        const key = getMonthKey();
        db[key].price = pricePerMenu;
        saveDB();
        render();
    }

    function resetMonth() {
        if (confirm('¿Quieres borrar las marcas de este mes?')) {
            const key = getMonthKey();
            db[key].days = {};
            saveDB();
            render();
        }
    }

    function sendWhatsApp() {
        const options = { month: 'long', year: 'numeric' };
        const monthName = currentDate.toLocaleDateString('es-ES', options);
        const yesCount = document.getElementById('countYes').textContent;
        const totalAmount = document.getElementById('totalAmount').textContent;

        const text = `🍱 *Comedor Olivia - ${monthName}*\n\n` +
                     `✅ Días asistidos: *${yesCount}*\n` +
                     `💰 Total a pagar: *${totalAmount}*`;

        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    // Inicializar
    render();
</script>
    
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
