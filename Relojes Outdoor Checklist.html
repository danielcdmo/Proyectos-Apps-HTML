<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Checklist Outdoor Relojes CDMO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root, [data-theme="dark"] {
            --bg-grad: linear-gradient(180deg, #07090e 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.65);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.5);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --accent-green: #30d158;
            --accent-green-glow: rgba(48, 209, 88, 0.2);
            --accent-blue: #0a84ff;
            --accent-purple: #bf5af2;
            --accent-orange: #ff9f0a;
            --neutral-bg: rgba(255, 255, 255, 0.06);
            --input-bg: rgba(15, 23, 42, 0.8);
            --border-item: rgba(255, 255, 255, 0.05);
        }

        [data-theme="light"] {
            --bg-grad: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.9);
            --card-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.06);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-green: #059669;
            --accent-green-glow: rgba(5, 150, 105, 0.18);
            --accent-blue: #0284c7;
            --accent-purple: #7c3aed;
            --accent-orange: #d97706;
            --neutral-bg: rgba(0, 0, 0, 0.04);
            --input-bg: rgba(255, 255, 255, 0.95);
            --border-item: rgba(0, 0, 0, 0.06);
        }

        [data-theme="sun"] {
            --bg-grad: #ffffff;
            --card-bg: #ffffff;
            --card-border: #000000;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --text-main: #000000;
            --text-sub: #222222;
            --accent-green: #008a20;
            --accent-green-glow: transparent;
            --accent-blue: #0048b3;
            --accent-purple: #6a00b8;
            --accent-orange: #b34700;
            --neutral-bg: #e5e7eb;
            --input-bg: #ffffff;
            --border-item: #cccccc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: var(--bg-grad);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 30px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        [data-theme="sun"] .header-title {
            background: none;
            -webkit-text-fill-color: #000000;
            color: #000000;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 6px 12px;
            cursor: pointer;
            backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 18px;
            backdrop-filter: blur(25px);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .select-custom {
            width: 100%;
            background: var(--input-bg);
            border: 1.5px solid var(--card-border);
            color: var(--text-main);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.92rem;
            font-weight: 800;
            outline: none;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding-bottom: 4px;
            border-bottom: 1.5px solid var(--card-border);
        }

        .check-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 1px solid var(--border-item);
        }

        .check-item:last-child {
            border-bottom: none;
        }

        .checkbox-custom {
            width: 24px;
            height: 24px;
            border-radius: 7px;
            border: 2px solid var(--card-border);
            background: var(--neutral-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.2s ease;
            font-weight: 900;
        }

        .checkbox-custom.checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #ffffff;
        }

        .item-text {
            font-size: 0.88rem;
            line-height: 1.4;
            font-weight: 600;
            color: var(--text-main);
        }

        .item-text.done {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-action {
            flex: 1;
            padding: 13px 8px;
            border-radius: 16px;
            border: 1.5px solid var(--card-border);
            font-weight: 800;
            font-size: 0.84rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: var(--card-shadow);
        }

        .btn-pdf { background: var(--accent-purple); color: #ffffff; }
        .btn-reset { background: var(--neutral-bg); color: var(--text-main); }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: var(--neutral-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.3s ease;
        }

        .print-title { display: none; }

        /* MODO IMPRESIÓN AJUSTADO A 1 PÁGINA */
        @media print {
            @page {
                size: A4 portrait;
                margin: 8mm 10mm;
            }
            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                height: auto !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .container {
                max-width: 100% !important;
                width: 100% !important;
                gap: 4px !important;
                padding: 0 !important;
            }
            .top-bar, .actions, #selectorCard { 
                display: none !important; 
            }
            .print-title { 
                display: block !important; 
                font-size: 1.15rem !important; 
                font-weight: 900 !important; 
                margin-bottom: 6px !important; 
                text-align: center; 
                color: #000000 !important;
                -webkit-text-fill-color: #000000 !important;
            }
            .glass-card { 
                background: none !important; 
                border: 1.5px solid #000000 !important; 
                box-shadow: none !important; 
                color: #000000 !important; 
                margin: 0 !important; 
                padding: 8px 12px !important; 
            }
            .section-title { 
                color: #000000 !important; 
                border-color: #000000 !important;
                font-size: 0.78rem !important;
                margin-top: 6px !important;
                padding-bottom: 2px !important;
            }
            .check-item {
                border-bottom: 1px solid #e0e0e0 !important;
                padding: 3.5px 0 !important;
                gap: 8px !important;
            }
            .checkbox-custom { 
                width: 16px !important;
                height: 16px !important;
                border: 1.5px solid #000000 !important;
                font-size: 0.7rem !important;
                margin-top: 1px !important;
            }
            .checkbox-custom.checked { 
                background: #000000 !important; 
                color: #ffffff !important; 
            }
            .item-text { 
                color: #000000 !important; 
                font-size: 0.73rem !important;
                line-height: 1.25 !important;
            }
            .item-text.done { 
                text-decoration: line-through !important; 
                color: #555555 !important; 
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1 class="header-title">🏔️ Relojes Checklist CDMO</h1>
        <button class="theme-toggle" onclick="cycleTheme()" id="themeBtn">🌙 Noche</button>
    </div>

    <h2 class="print-title" id="printHeaderTitle">Checklist Outdoor</h2>

    <div class="glass-card" id="selectorCard">
        <div class="form-group">

                <option value="g7900">🌊 7. Casio G-Shock G-7900 (Mareas y Luna)</option>
                <option value="dw6900rl">⏱️ 8. Casio G-Shock DW-6900RL (Clásico Digital)</option>
                <option value="apple_watch">⌚ 9. Apple Watch (Komoot Offline & Salud)</option>
            </select>
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 800; color: var(--text-sub); margin-bottom: 6px;">
                <span>Progreso de Verificación</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <div class="glass-card" id="checklistContainer"></div>

    <div class="actions">
        <button class="btn-action btn-pdf" onclick="window.print()">📄 Exportar a PDF</button>
        <button class="btn-action btn-reset" onclick="resetCurrentChecklist()">🔄 Reiniciar</button>
    </div>
</div>

            phases: [
                {
                    title: "🏠 En casa (Antes de salir)",
                    items: [
                        "⚡ Batería: Cargar reloj al 100 %.",
                        "📥 Komoot Offline: Confirmar ruta descargada offline en el reloj.",
                        "🔗 Sincronización Salud: Verificar permisos en Apple Salud (Strava, Wikiloc, Suunto, etc.)."
                    ]
                },
                {
                    title: "🚗 En el punto de inicio",
                    items: [
                        "🗺️ Iniciar navegación: Abrir Komoot y comenzar recorrido offline.",
                        "🛰️ Señal GPS: Confirmar posición precisa antes de empezar a andar.",
                        "💧 Bloqueo de agua: Activar en Centro de Control si llueve o hay sudor."
                    ]
                },
                {
                    title: "🥾 Durante la ruta",
                    items: [
                        "🔔 Navegación: Guiarse por vibraciones hápticas e indicaciones de giro.",
                        "🪫 Gestión de energía: Activar bajo consumo si la ruta es muy larga."
                    ]
                },
                {
                    title: "🏁 Al finalizar",
                    items: [
                        "💾 Guardar actividad: Finalizar trayecto en Komoot.",
                        "🔊 Expulsar agua: Girar Digital Crown para desbloquear altavoz.",
                        "🔄 Sincronización en cadena: Verificar volcado a Apple Salud y apps externas.",
                        "🪥 Mantenimiento: Enjuagar con agua dulce, secar y poner a cargar."
                    ]
                }
            ]
        }
    };

    let checkedState = JSON.parse(localStorage.getItem('cdmo_watches_checklist')) || {};

    const THEMES = ['dark', 'light', 'sun'];
    const THEME_LABELS = {
        'dark': '🌙 Noche',
        'light': '☀️ Día',
        'sun': '⚡ Máximo Sol'
    };

    function initTheme() {
        const saved = localStorage.getItem('theme_pref_outdoor') || 'dark';
        applyTheme(saved);
    }

    function cycleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const nextIndex = (THEMES.indexOf(current) + 1) % THEMES.length;
        const nextTheme = THEMES[nextIndex];
        applyTheme(nextTheme);
    }

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme_pref_outdoor', theme);
        document.getElementById('themeBtn').textContent = THEME_LABELS[theme];
    }

    function renderChecklist() {
        const watchKey = document.getElementById('watchSelect').value;
        const watch = WATCH_DATA[watchKey];
        const container = document.getElementById('checklistContainer');
        document.getElementById('printHeaderTitle').textContent = `Checklist Outdoor - ${watch.name}`;

        if (!checkedState[watchKey]) checkedState[watchKey] = {};

        let html = '';
        let totalItems = 0;
        let checkedCount = 0;

        watch.phases.forEach((phase, pIdx) => {
            html += `<div class="section-title">${phase.title}</div>`;
            phase.items.forEach((item, iIdx) => {
                const itemId = `chk_${pIdx}_${iIdx}`;
                const isChecked = !!checkedState[watchKey][itemId];
                totalItems++;
                if (isChecked) checkedCount++;

                html += `
                    <div class="check-item" onclick="toggleItem('${watchKey}', '${itemId}')">
                        <div class="checkbox-custom ${isChecked ? 'checked' : ''}">
                            ${isChecked ? '✓' : ''}
                        </div>
                        <div class="item-text ${isChecked ? 'done' : ''}">${item}</div>
                    </div>
                `;
            });
        });

        container.innerHTML = html;

        const pct = totalItems === 0 ? 0 : Math.round((checkedCount / totalItems) * 100);
        document.getElementById('progressText').textContent = `${pct}% (${checkedCount}/${totalItems})`;
        document.getElementById('progressFill').style.width = `${pct}%`;
    }

    function toggleItem(watchKey, itemId) {
        checkedState[watchKey][itemId] = !checkedState[watchKey][itemId];
        localStorage.setItem('cdmo_watches_checklist', JSON.stringify(checkedState));
        renderChecklist();
    }

    function resetCurrentChecklist() {
        const watchKey = document.getElementById('watchSelect').value;
        if (confirm(`¿Reiniciar todas las casillas marcadas para este reloj?`)) {
            checkedState[watchKey] = {};
            localStorage.setItem('cdmo_watches_checklist', JSON.stringify(checkedState));
            renderChecklist();
        }
    }

    initTheme();
    renderChecklist();
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
</script>

</body>
</html>
