<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Test CDMO</title>
    <style>
        :root {
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --accent-green: #30d158;
            --accent-blue: #0a84ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #0b0f19;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: var(--accent-blue);
        }

        p {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--accent-green);
            color: #000000;
            border: none;
            border-radius: 14px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .status {
            margin-top: 14px;
            font-size: 0.8rem;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 Test Sync CDMO</h1>
    <p>¡Flujo iPhone ➔ Atajo ➔ iCloud ➔ Mac ➔ GitHub Pages funcionando perfecto!</p>
    <button class="btn" onclick="testClick()">Probar Botón</button>
    <div class="status" id="statusMsg">Listo para probar</div>
</div>

<script>
    function testClick() {
        const time = new Date().toLocaleTimeString();
        document.getElementById('statusMsg').textContent = `✓ Pulsado con éxito a las ${time}`;
    }
</script>

</body>
</html>
